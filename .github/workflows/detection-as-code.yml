name: Detection as Code

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: detection-as-code-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Sigma source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Log workflow context
        shell: bash
        run: |
          echo "DAC | INFO | stage=ci | event=${{ github.event_name }} | ref=${{ github.ref }} | sha=${{ github.sha }} | workflow started"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install pinned detection toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "DAC | INFO | stage=dependencies | installing pinned Python dependencies"
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version
          for package in ('pysigma', 'sigma-cli', 'pysigma-backend-kusto', 'PyYAML', 'jsonschema'):
              print(f"DAC | INFO | stage=dependencies | package={package} | version={version(package)} | dependency ready")
          PY

      - name: Validate Sigma source and platform configuration
        run: python tools/validate.py

      - name: Compile Sigma and render Microsoft Sentinel content
        run: python tools/build.py --compiler pysigma --output build/ms-sentinel

      - name: Verify generated Sentinel content
        run: python tools/verify_output.py build/ms-sentinel

      - name: Run unit tests
        shell: bash
        run: |
          echo "DAC | INFO | stage=test | starting unit tests"
          python -m unittest discover -s tests -v
          echo "DAC | INFO | stage=test | unit tests passed"

      - name: Write pipeline summary
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          manifest = json.loads(Path('build/ms-sentinel/_build/build-manifest.json').read_text())
          rules = sum(len(v['rules']) for v in manifest['clients'].values())
          sys.path.insert(0, 'tools')
          from daclib import discover_rules
          sources = discover_rules()
          clients = len(manifest['clients'])
          publish = os.getenv('PUBLISH_ENABLED') == 'true'
          event = os.getenv('EVENT_NAME')
          out = Path(os.environ['GITHUB_STEP_SUMMARY'])
          out.write_text(
              '# Detection-as-Code quality gate\n\n'
              f'- Event: **{event}**\n'
              f'- Source Sigma rules: **{len(sources)}**\n'
              f'- Client targets: **{clients}**\n'
              f'- Generated Sentinel templates: **{rules}**\n'
              f'- Compiler: **pySigma / Kusto backend**\n'
              f'- Quality gate: **PASSED**\n'
              f'- Publish on this run: **{"yes" if event == "push" and publish else "no"}**\n'
          )
          PY
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}

      - name: Upload tested Sentinel build
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ms-sentinel-${{ github.sha }}
          path: build/ms-sentinel/
          if-no-files-found: error
          retention-days: 7

      # CD starts only after a merge/push to main. Pull-request runs never receive
      # or use the target-repository credential.
      - name: Generate MS-Sentinel GitHub App token
        id: app-token
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_ENABLED == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: MS-Sentinel
          permission-contents: write

      - name: Validate publish configuration
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_ENABLED == 'true' }}
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ vars.MS_SENTINEL_REPOSITORY }}
          TARGET_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          [[ -n "$TARGET_REPOSITORY" ]] || { echo "::error title=Detection-as-Code publish::MS_SENTINEL_REPOSITORY is not configured"; exit 1; }
          [[ -n "$TARGET_TOKEN" ]] || { echo "::error title=Detection-as-Code publish::GitHub App token was not generated"; exit 1; }
          echo "DAC | INFO | stage=publish | repository=$TARGET_REPOSITORY | publish configuration valid"

      - name: Checkout MS-Sentinel target repository
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_ENABLED == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.MS_SENTINEL_REPOSITORY }}
          token: ${{ steps.app-token.outputs.token }}
          path: target-ms-sentinel
          fetch-depth: 0

      - name: Publish tested Sentinel content
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_ENABLED == 'true' }}
        shell: bash
        run: ./scripts/publish_ms_sentinel.sh build/ms-sentinel target-ms-sentinel "${{ github.sha }}"

      - name: Log completion
        if: always()
        shell: bash
        run: |
          echo "DAC | INFO | stage=ci | event=${{ github.event_name }} | ref=${{ github.ref }} | sha=${{ github.sha }} | job_status=${{ job.status }} | workflow finished"
